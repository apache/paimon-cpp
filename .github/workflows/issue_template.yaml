name: Issue Template Check

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: ${{ github.repository }}-issue-template-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  issue-template:
    name: Check issue template
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout validation script
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Check issue and update template reminder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/check_issue_template.py
