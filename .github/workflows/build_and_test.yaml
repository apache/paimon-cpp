name: Build and Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    name: script-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Run CMake module tests
        shell: bash
        run: ci/scripts/test_cmake_modules.sh
      - name: Run packaging argument tests
        shell: bash
        run: ci/scripts/test_packaging_args.sh
      - name: Run asan_symbolize tests
        shell: bash
        run: ci/scripts/test_asan_symbolize.sh

  macos-build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: appleclang-release-arm64
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            build_type: Release
          - name: appleclang-debug-arm64
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            build_type: Debug
          - name: gcc15-release-macos-arm64
            cc: /opt/homebrew/bin/gcc-15
            cxx: /opt/homebrew/bin/g++-15
            build_type: Release
            gcc_formula: gcc@15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PAIMON_BUILD_JOBS: '3'
      CARGO_BUILD_JOBS: '3'
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
      - name: Install build dependencies
        shell: bash
        run: |
          brew install cmake ninja protobuf openssl@3 curl
          echo "$(brew --prefix protobuf)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix curl)" >> "$GITHUB_ENV"
      - name: Install GCC
        if: matrix.gcc_formula
        shell: bash
        env:
          GCC_FORMULA: ${{ matrix.gcc_formula }}
        run: brew install "${GCC_FORMULA}"
      - name: Show compiler versions
        shell: bash
        run: |
          "${CC}" --version
          "${CXX}" --version
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-${{ matrix.name }}
      - name: Install Rust and protobuf tools
        shell: bash
        run: ci/scripts/setup_rust.sh
      - name: Install flatc and libclang (Vortex)
        shell: bash
        run: ci/scripts/setup_flatc.sh
      - name: Build, test and verify installation
        shell: bash
        run: |
          ci/scripts/build_paimon.sh \
            --source_dir "$(pwd)" \
            --build_type "${{ matrix.build_type }}" \
            --install_smoke
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-test-logs
          path: |
            build/build/test-logs/
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
      - name: Show ccache statistics
        if: always()
        run: ccache -s

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout_minutes || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release-x86_64
            cc: gcc-14
            cxx: g++-14
            build_args: --build_type Release
          - name: clang-release-x86_64
            build_args: --build_type Release
          - name: gcc-debug-x86_64
            cc: gcc-14
            cxx: g++-14
            # Also read the full-text archives written by Paimon C++ with the Python reader.
            build_args: --verify_full_text_archives
          - name: clang-debug-x86_64
            fetch_depth: '0' # fetch the PR target branch history for clang-tidy
            timeout_minutes: 180
            build_args: >-
              --check_clang_tidy
              --lint_git_target_commit "origin/${{ github.base_ref || github.event.repository.default_branch }}"
          - name: asan-ubsan-x86_64
            build_args: --enable_asan --enable_ubsan
          - name: tsan-x86_64
            build_args: --enable_tsan
          - name: gcc-debug-aarch64
            runner: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
          - name: gcc-release-aarch64
            runner: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
            build_args: --build_type Release
          - name: gcc13-release-aarch64
            runner: ubuntu-24.04-arm
            cc: gcc-13
            cxx: g++-13
            gcc_version: '13.3.0'
            build_args: --build_type Release
          - name: clang-debug-aarch64
            runner: ubuntu-24.04-arm
          - name: asan-ubsan-aarch64
            runner: ubuntu-24.04-arm
            build_args: --enable_asan --enable_ubsan
          - name: clang-release-aarch64
            runner: ubuntu-24.04-arm
            build_args: --build_type Release
          - name: tsan-aarch64
            runner: ubuntu-24.04-arm
            build_args: --enable_tsan
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
          fetch-depth: ${{ matrix.fetch_depth || '1' }}
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-${{ matrix.name }}
      - name: Install Rust and protobuf tools
        shell: bash
        run: ci/scripts/setup_rust.sh
      - name: Install build and debugging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb libcurl4-openssl-dev libssl-dev
      - name: Install and verify regression compiler
        if: matrix.gcc_version
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          EXPECTED_GCC_VERSION: ${{ matrix.gcc_version }}
        run: |
          sudo apt-get install -y "${CC}" "${CXX}"
          "${CC}" --version
          "${CXX}" --version
          test "$("${CC}" -dumpfullversion)" = "${EXPECTED_GCC_VERSION}"
          test "$("${CXX}" -dumpfullversion)" = "${EXPECTED_GCC_VERSION}"
      - name: Install flatc and libclang (Vortex)
        shell: bash
        run: ci/scripts/setup_flatc.sh
      - name: Build Paimon
        shell: bash
        env:
          CC: ${{ matrix.cc || 'clang' }}
          CXX: ${{ matrix.cxx || 'clang++' }}
        run: |
          sudo sysctl -w kernel.core_pattern='core.%e.%p'
          ulimit -c unlimited
          ci/scripts/build_paimon.sh \
            --source_dir "$(pwd)" \
            ${{ matrix.build_args }}
      - name: Show ccache statistics
        if: always()
        run: ccache -s
