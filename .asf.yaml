# https://cwiki.apache.org/confluence/display/INFRA/Git+-+.asf.yaml+features

github:
  description: "Paimon-cpp is a high-performance C++ implementation of Apache Paimon."
  homepage: https://paimon.apache.org/docs/cpp/
  ghp_branch: gh-pages
  ghp_path: /
  labels:
    - paimon
    - apache
    - cpp
  enabled_merge_buttons:
    merge: false
    squash: true
    rebase: false
  rulesets:
    - name: "Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release-*"
        excludes: []
      restrict_deletion: true
      restrict_force_push: true
      required_linear_history: true
      required_conversation_resolution: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_last_push_approval: true
        required_approving_review_count: 1
      required_status_checks:
        - name: "pre-commit"
          app_slug: -1
        - name: "gcc-test"
          app_slug: -1
        - name: "rat-license-check"
          app_slug: -1
        - name: "test-with-sanitizer"
          app_slug: -1
        - name: "clang-release"
          app_slug: -1
        - name: "gcc-release"
          app_slug: -1
        - name: "clang-test"
          app_slug: -1
        - name: "gcc8-test"
          app_slug: -1
  pull_requests:
    allow_auto_merge: false
    allow_update_branch: true
    del_branch_on_merge: false
  features:
    wiki: true
    issues: true
    projects: false

notifications:
  commits:      commits@paimon.apache.org
  issues:       issues@paimon.apache.org
  pullrequests: issues@paimon.apache.org
