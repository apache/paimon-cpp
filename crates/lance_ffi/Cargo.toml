[package]
name = "paimon_lance_ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI layer for the Paimon C++ Lance file format"
license = "Apache-2.0"
publish = false

[lib]
name = "paimon_lance_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
arrow = { version = "56.1", features = ["ffi"] }
futures = "0.3"
lance-core = "=0.39.0"
lance-encoding = "=0.39.0"
lance-file = "=0.39.0"
lance-io = "=0.39.0"
object_store = "0.12.3"
tokio = { version = "1.23", features = ["rt-multi-thread", "macros", "fs", "sync"] }

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
